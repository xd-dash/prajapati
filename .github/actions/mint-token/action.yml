name: "Mint Tenant Token"
description: >-
  Mints a short-lived GCP token for a tenant's service account by running
  Prajapati's cmd/mint-token locally in the calling job. This is Google-specific
  compatibility tooling; it is not Prajapati's provider-neutral identity path.
inputs:
  target-service-account:
    description: "Email of the tenant service account to mint a token for"
    required: true
  minter-service-account:
    description: >-
      Email of the token-minter service account to delegate through. Leave blank
      only if the calling identity has roles/iam.serviceAccountTokenCreator
      directly on target-service-account.
    required: false
    default: ""
  kind:
    description: '"access" or "id"'
    required: false
    default: "id"
  scopes:
    description: "Comma-separated OAuth scopes (access tokens only)"
    required: false
    default: "https://www.googleapis.com/auth/cloud-platform"
  audience:
    description: "Audience (required when kind is id)"
    required: false
    default: ""
  lifetime:
    description: "Access token lifetime (access tokens only), Go duration syntax"
    required: false
    default: "10m"
  include-email:
    description: "Include the target service-account email in ID tokens"
    required: false
    default: "true"
  ref:
    description: "Branch/tag/commit of xd-dash/prajapati to run cmd/mint-token from"
    required: false
    default: "main"

outputs:
  token:
    description: "The minted token"
    value: ${{ steps.mint.outputs.token }}

runs:
  using: composite
  steps:
    - name: Check out Prajapati
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: xd-dash/prajapati
        ref: ${{ inputs.ref }}
        path: mint-token-prajapati
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: mint-token-prajapati/go.mod
        cache: false

    - name: Mint token
      id: mint
      shell: bash
      working-directory: mint-token-prajapati
      env:
        TARGET_SERVICE_ACCOUNT: ${{ inputs.target-service-account }}
        MINTER_SERVICE_ACCOUNT: ${{ inputs.minter-service-account }}
        TOKEN_KIND: ${{ inputs.kind }}
        TOKEN_SCOPES: ${{ inputs.scopes }}
        TOKEN_AUDIENCE: ${{ inputs.audience }}
        TOKEN_LIFETIME: ${{ inputs.lifetime }}
        TOKEN_INCLUDE_EMAIL: ${{ inputs.include-email }}
      run: |
        set -euo pipefail
        args=(
          -target "$TARGET_SERVICE_ACCOUNT"
          -kind "$TOKEN_KIND"
          -scopes "$TOKEN_SCOPES"
          -lifetime "$TOKEN_LIFETIME"
        )
        if [ -n "$MINTER_SERVICE_ACCOUNT" ]; then
          args+=(-delegate "$MINTER_SERVICE_ACCOUNT")
        fi
        if [ -n "$TOKEN_AUDIENCE" ]; then
          args+=(-audience "$TOKEN_AUDIENCE")
        fi
        if [ "$TOKEN_INCLUDE_EMAIL" = "true" ]; then
          args+=(-include-email)
        fi
        token="$(go run ./cmd/mint-token "${args[@]}" 2>mint.log)"
        cat mint.log >&2
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"
